name: Build docker image

on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - '*'

permissions:
  contents: read

env:
  MYSQL84: '8.4.11'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
        - amd64
        - arm64
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v5
    - uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and test
      id: build-image
      env:
        ARCH: ${{ matrix.arch }}
        MYSQL_VER: ${{ env.MYSQL84 }}
      run: |
        make
        make test
        IMAGE="$(make --no-print-directory -s image-ref)" bash ./tests/ghost.sh
        echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
    - name: Scan image
      uses: ./.github/actions/grype
      with:
        image: docker:${{ steps.build-image.outputs.image }}
    - name: Push scanned architecture image
      if: github.event_name == 'push'
      env:
        ARCH: ${{ matrix.arch }}
        MYSQL_VER: ${{ env.MYSQL84 }}
      run: make push

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
    - uses: docker/login-action@v3
      if: github.event_name == 'push'
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - uses: ./.github/actions
      with:
        version: ${{ env.MYSQL84 }}
        latest: 'true'
        latest_major: 'true'
